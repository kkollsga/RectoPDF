[package]
name = "recto-reader"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# QA seams that force an ordering a window meets only now and then (`Engine::qa()`: a busy view made to last, an ask held between its tick and the lock). A release build of the app doesn't have them; `recto-app`'s test builds turn it on.
qa = []

[lints]
workspace = true

[dependencies]
recto-core.workspace = true
recto-index.workspace = true
recto-platform.workspace = true
recto-proto.workspace = true
recto-render-service.workspace = true
serde_json.workspace = true

[dev-dependencies]
# For a test's protected file, which only lopdf's writer encrypts. Already in the tree through recto-core.
lopdf.workspace = true
recto-testpdf.workspace = true
