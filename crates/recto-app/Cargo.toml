[package]
name = "recto-app"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The fakes in `testkit`, and the headless app made of them, for other crates' tests.
testkit = ["dep:recto-testpdf", "recto-reader/qa", "recto-agent/test-words", "recto-index/test-seams"]

[lints]
workspace = true

[dependencies]
recto-agent.workspace = true
recto-control.workspace = true
recto-core.workspace = true
recto-index.workspace = true
recto-platform.workspace = true
recto-proto.workspace = true
recto-reader.workspace = true
recto-render-service.workspace = true
recto-session.workspace = true
recto-update.workspace = true
serde_json.workspace = true
# The headless app's test files, with `testkit` only.
recto-testpdf = { workspace = true, optional = true }

[dev-dependencies]
recto-platform = { workspace = true, features = ["test-seams"] }
# The removal record's fixtures (`removal_store::barrier::fixture`), for the headless tests of an unfinished removal.
recto-control = { workspace = true, features = ["test-seams"] }
# The page view's QA seams (`Engine::hold_busy`) for the headless tests, as `testkit` has them for other crates' tests.
recto-reader = { workspace = true, features = ["qa"] }
# Tests read a refusal's code as the wire does.
recto-agent = { workspace = true, features = ["test-words"] }
# For the headless tests' protected file, which only lopdf's writer encrypts.
lopdf.workspace = true
recto-testpdf.workspace = true
# The comparison walks give every renderer a page deadline it always meets (`page_deadline_for_this_process`), which a build of this crate's tests
# alone (`-p recto-app`) didn't have, as only recto-agent's tests turned it on.
recto-render-service = { workspace = true, features = ["test-seams"] }
# The Snapshot tool's tests read the PNG it copies.
recto-svg.workspace = true
# `tests/inner_allocations.rs` drives the headless app, which is the testkit's.
recto-app = { workspace = true, features = ["testkit"] }
