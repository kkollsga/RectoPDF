[package]
name = "recto-app"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The fakes in `testkit`, and the headless app made of them, for other crates' tests.
testkit = ["dep:recto-testpdf"]

[lints]
workspace = true

[dependencies]
recto-agent.workspace = true
recto-control.workspace = true
recto-core.workspace = true
recto-index.workspace = true
recto-platform.workspace = true
recto-proto.workspace = true
recto-reader.workspace = true
recto-render-service.workspace = true
recto-session.workspace = true
recto-update.workspace = true
serde_json.workspace = true
# The headless app's test files, with `testkit` only.
recto-testpdf = { workspace = true, optional = true }

[dev-dependencies]
# For the headless tests' protected file, which only lopdf's writer encrypts.
lopdf.workspace = true
recto-testpdf.workspace = true
