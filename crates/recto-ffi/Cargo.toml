[package]
name = "recto-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "recto_ffi"
# The app links the static library. `lib` is for the binding generator and the tests.
crate-type = ["staticlib", "lib"]

[features]
# Only the binding generator needs these, so they stay out of the app.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
recto-agent.workspace = true
recto-control.workspace = true
recto-platform.workspace = true
recto-proto.workspace = true
recto-reader.workspace = true
recto-render-service.workspace = true
recto-session.workspace = true
serde_json.workspace = true
# Held at 0.31 while uniffi-bindgen-cs, for the Windows app later, supports nothing newer.
uniffi = { version = "0.31", default-features = false }

[dev-dependencies]
recto-testpdf.workspace = true
