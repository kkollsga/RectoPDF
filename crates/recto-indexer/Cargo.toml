[package]
name = "recto-indexer"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# A helper process, so what indexing costs ends when it exits. SPEC §2: background work is a helper process, at utility, and exits when done.
[[bin]]
name = "recto-indexer"
path = "src/main.rs"

[dependencies]
recto-core.workspace = true
recto-index.workspace = true
recto-platform.workspace = true
recto-render-service.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Test-only: `find_key::audit`, the look at a built program for the Keychain's code.
recto-platform = { workspace = true, features = ["test-seams"] }
# Test-only: a small PDF.
recto-testpdf.workspace = true
