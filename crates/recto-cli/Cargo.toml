[package]
name = "recto-cli"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "recto"
path = "src/main.rs"

[dependencies]
recto-agent.workspace = true
recto-control.workspace = true
recto-core.workspace = true
recto-index.workspace = true
recto-platform.workspace = true
recto-session.workspace = true
recto-update.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Test-only: a process's start time, to tell a reused pid from the copy being waited for (`copy_cleanup`).
libc.workspace = true
# Test-only: `corpus::opened_text`, to read what a state folder keeps of a document.
recto-index = { workspace = true, features = ["test-seams"] }
# Test-only: `find_key::audit`, the look at a built program for the Keychain's code.
recto-platform = { workspace = true, features = ["test-seams"] }
# Tests read a refusal's code as the wire does.
recto-agent = { workspace = true, features = ["test-words"] }
# To make an encrypted file with permissions, as nothing else here writes one.
lopdf.workspace = true
recto-svg.workspace = true
recto-proto.workspace = true
recto-render-service.workspace = true
recto-testpdf.workspace = true
sha2.workspace = true
