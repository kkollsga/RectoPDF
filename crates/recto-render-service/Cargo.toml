[package]
name = "recto-render-service"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Seams only this crate's own tests use (`under_page_deadline_for_test`). Turned on by the dev-dependency on itself below and by nothing in the app's
# dependency graph, so a release `recto-ffi` or `recto-cli` doesn't contain them.
test-seams = []

[lints]
workspace = true

# The library is the host's side: spawn, limits, validation. It never loads PDFium.
[lib]
name = "recto_render_service"
path = "src/lib.rs"

# The binary is the worker. Only it uses recto-render, so only it reaches PDFium.
[[bin]]
name = "recto-render-service"
path = "src/bin/worker.rs"

[dependencies]
recto-platform.workspace = true
recto-proto.workspace = true
recto-render.workspace = true

[dev-dependencies]
lopdf.workspace = true
# Its own tests build it with its test seams.
recto-render-service = { path = ".", features = ["test-seams"] }
recto-testpdf.workspace = true

# A stand-in worker in `tests/handles.rs` sends what `Channel::send` wouldn't.
[target.'cfg(target_os = "macos")'.dev-dependencies]
libc.workspace = true
