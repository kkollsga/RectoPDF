[package]
name = "recto-control"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# For tests only, and never in the app: `AppKey::standing_in`, a stand-in for the Keychain.
test-seams = []

[dependencies]
libc.workspace = true
recto-agent.workspace = true
recto-core.workspace = true
recto-index.workspace = true
recto-platform.workspace = true
recto-session.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Its own test seams, for the integration tests (`tests/ledger_cost.rs`): in a test build only, never the app's.
recto-control = { path = ".", features = ["test-seams"] }
# Test-only: `FindKey::for_tests`.
recto-platform = { workspace = true, features = ["test-seams"] }
# Tests read a refusal's code as the wire does.
recto-agent = { workspace = true, features = ["test-words"] }
recto-testpdf.workspace = true
recto-proto.workspace = true
# Test-only: the installer's own `copy_record`, so a survey of the update's copy reads what the installer writes.
recto-update.workspace = true

# For a test only, never in the app: the indexer asked for the Find key on a real main thread (`tests/main_thread.rs`).
[[bin]]
name = "recto-main-thread-probe"
path = "src/bin/recto-main-thread-probe.rs"
test = false
