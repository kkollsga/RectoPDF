# libFuzzer targets. Its own workspace, so `tools/check.sh` and CI never build it. It needs nightly: see tools/fuzz.sh.
[package]
name = "recto-fuzz-targets"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
recto-fuzz = { path = "../crates/recto-fuzz" }

[profile.release]
debug = 1
