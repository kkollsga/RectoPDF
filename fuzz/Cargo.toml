# libFuzzer targets. Its own workspace, so `tools/check.sh` and CI never build it. It needs nightly: see tools/fuzz.sh.
[package]
name = "recto-fuzz-targets"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
recto-fuzz = { path = "../crates/recto-fuzz" }

[profile.release]
debug = 1

[[bin]]
name = "pdf_bytes"
path = "fuzz_targets/pdf_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdf_tree"
path = "fuzz_targets/pdf_tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proto"
path = "fuzz_targets/proto.rs"
test = false
doc = false
bench = false

[[bin]]
name = "index"
path = "fuzz_targets/index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "agent"
path = "fuzz_targets/agent.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control"
path = "fuzz_targets/control.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edits"
path = "fuzz_targets/edits.rs"
test = false
doc = false
bench = false
