[workspace]
resolver = "3"
members = ["crates/*"]
# Its own workspace, so distillPDF's lopdf features stay out of the app: see its Cargo.toml.
exclude = ["crates/recto-headings"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace.dependencies]
recto-platform = { path = "crates/recto-platform" }
recto-core = { path = "crates/recto-core" }
recto-sign = { path = "crates/recto-sign" }
recto-session = { path = "crates/recto-session" }
recto-app = { path = "crates/recto-app" }
recto-agent = { path = "crates/recto-agent" }
recto-control = { path = "crates/recto-control" }
recto-proto = { path = "crates/recto-proto" }
recto-render = { path = "crates/recto-render" }
recto-render-service = { path = "crates/recto-render-service" }
recto-index = { path = "crates/recto-index" }
recto-svg = { path = "crates/recto-svg" }
recto-reader = { path = "crates/recto-reader" }
recto-indexer = { path = "crates/recto-indexer" }
recto-testpdf = { path = "crates/recto-testpdf" }
recto-update = { path = "crates/recto-update" }
# The owner's fork, on lopdf 0.47: its lazy IndexedReader, append writer and streaming rewrite (its `main` at `e5f4971`: the streaming rewrite, usage rights removed in place, and blank signature fields kept through a rewrite). Pinned to a revision so builds repeat.
lopdf = { git = "https://github.com/kkollsga/lopdf.git", rev = "e5f497163b364fae5217f9b1288ccacd39a9870a", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std", "float_roundtrip"] }
libc = { version = "0.2", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.11", default-features = false }
crc32fast = { version = "1", default-features = false }
grep-regex = { version = "0.1", default-features = false }
grep-matcher = { version = "0.1", default-features = false }

[workspace.lints.rust]
# Denied, not forbidden, so a memory test can install a counting allocator. Only recto-platform allows it in library code.
unsafe_code = "deny"

[profile.dev]
debug = "line-tables-only"
# Packed: on macOS the default (unpacked) leaves every codegen unit's .o in target/debug/deps after each link, about 5,400 files per edit of recto-session and never removed; main had 408,000, and the first IOSurface in a test process lists its executable's folder (2026-11-12, tools/target-hygiene.sh). Packed keeps file:line in a backtrace for 2.7 s more per edit cycle (docs/agent-instructions/worker-testing.md).
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false

# Unpacking a whole app in a test takes minutes at no optimisation.
[profile.dev.package.miniz_oxide]
opt-level = 2
debug = false

[profile.dev.package.crc32fast]
opt-level = 2
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

# The owner's dev copy and quick release-like runs: release code, thin LTO across 16 units. After an edit to recto-session it rebuilt the app's
# Rust in 32 s against release's 74 s (docs/reports/build-performance-2026-11-11.md). Never for a budget or a release: those are `release`.
[profile.dev-release]
inherits = "release"
lto = "thin"
codegen-units = 16
