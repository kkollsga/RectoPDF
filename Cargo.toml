[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
recto-platform = { path = "crates/recto-platform" }
recto-core = { path = "crates/recto-core" }
recto-sign = { path = "crates/recto-sign" }
recto-session = { path = "crates/recto-session" }
recto-agent = { path = "crates/recto-agent" }
# The owner's fork, for its lazy IndexedReader, at the 0.47 merge. Pinned to a revision so builds repeat.
# A local URL until that branch is pushed; then this becomes https://github.com/kkollsga/lopdf.git at the same revision.
lopdf = { git = "file:///Volumes/EksternalHome/Koding/Rust/lopdf-lazy-engine", rev = "bc73ca505e44e6f03716531cec8326afa62ab8dc", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
libc = { version = "0.2", default-features = false }

[workspace.lints.rust]
# Denied, not forbidden, so a memory test can install a counting allocator. Only recto-platform allows it in library code.
unsafe_code = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"
