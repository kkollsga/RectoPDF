[workspace]
resolver = "3"
members = ["crates/*"]
# Its own workspace, so distillPDF's lopdf features stay out of the app: see its Cargo.toml.
exclude = ["crates/recto-headings"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace.dependencies]
recto-platform = { path = "crates/recto-platform" }
recto-core = { path = "crates/recto-core" }
recto-sign = { path = "crates/recto-sign" }
recto-session = { path = "crates/recto-session" }
recto-app = { path = "crates/recto-app" }
recto-agent = { path = "crates/recto-agent" }
recto-control = { path = "crates/recto-control" }
recto-proto = { path = "crates/recto-proto" }
recto-render = { path = "crates/recto-render" }
recto-render-service = { path = "crates/recto-render-service" }
recto-index = { path = "crates/recto-index" }
recto-svg = { path = "crates/recto-svg" }
recto-reader = { path = "crates/recto-reader" }
recto-indexer = { path = "crates/recto-indexer" }
recto-testpdf = { path = "crates/recto-testpdf" }
recto-update = { path = "crates/recto-update" }
# The owner's fork, on lopdf 0.47: its lazy IndexedReader, append writer and streaming rewrite (its `main` at `e5f4971`: the streaming rewrite, usage rights removed in place, and blank signature fields kept through a rewrite). Pinned to a revision so builds repeat.
lopdf = { git = "https://github.com/kkollsga/lopdf.git", rev = "e5f497163b364fae5217f9b1288ccacd39a9870a", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std", "float_roundtrip"] }
libc = { version = "0.2", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.11", default-features = false }
# LZW, for the page digest's streaming decode (`recto-core/src/page_id/decode.rs`); already built for lopdf.
weezl = { version = "0.2", default-features = false, features = ["alloc"] }
crc32fast = { version = "1", default-features = false }
# A new key for the Find text (owner, 2026-11-15: "Lets store it encrypted"): the OS's randomness, already built for lopdf.
getrandom = { version = "0.4", default-features = false }
# Overwrites the Find key when it goes, in a way the compiler can't drop. Comes with the cipher too (aes-gcm's `zeroize`).
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# The Find text sealed: AES-256-GCM over AES already built for lopdf, in hardware on Apple silicon and Intel; HKDF for a key per corpus.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "zeroize"] }
hkdf = { version = "0.13", default-features = false }
grep-regex = { version = "0.1", default-features = false }
grep-matcher = { version = "0.1", default-features = false }

[workspace.lints.rust]
# Denied, not forbidden, so a memory test can install a counting allocator. Only recto-platform allows it in library code.
unsafe_code = "deny"

[profile.dev]
debug = "line-tables-only"
# Packed: on macOS the default (unpacked) leaves every codegen unit's .o in target/debug/deps after each link, about 5,400 files per edit of recto-session and never removed; main had 408,000, and the first IOSurface in a test process lists its executable's folder (2026-11-12, tools/target-hygiene.sh). Packed keeps file:line in a backtrace for 2.7 s more per edit cycle (docs/agent-instructions/worker-testing.md).
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false

# Unpacking a whole app in a test takes minutes at no optimisation.
[profile.dev.package.miniz_oxide]
opt-level = 2
debug = false

[profile.dev.package.crc32fast]
opt-level = 2
debug = false

# Every test that opens a PDF parses it through lopdf, and unoptimised that was the biggest part of the protected-document walks' own work: in the walk
# of a tab that followed a protected one, 46 % of its thread's samples were `recto_core::inspect` (2026-11-15). The same binaries taking turns on this
# Mac (load 12 to 35): a fuzz smoke test 6.0 to 1.6 CPU-s, a deep outline 3.5 to 1.6, that walk 44 to 33; the in-process suite run side by side with
# itself, user CPU 185 to 156 s; the policy walks under `--like-ci`'s limits 57 to 78 s of wall to 42 to 47. Its own build: 4 to 5 s to 12 s, once
# per cache (CI's cache key has this file in it, so a change here is built once and saved). Optimisation only: debug assertions and overflow checks
# stay on, as for every dev build.
[profile.dev.package.lopdf]
opt-level = 2
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

# The owner's dev copy and quick release-like runs: release code, thin LTO across 16 units. After an edit to recto-session it rebuilt the app's
# Rust in 32 s against release's 74 s (docs/reports/build-performance-2026-11-11.md). Never for a budget or a release: those are `release`.
[profile.dev-release]
inherits = "release"
lto = "thin"
codegen-units = 16
