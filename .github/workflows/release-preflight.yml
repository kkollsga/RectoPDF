# Checks the release's signing secrets work, building and publishing nothing (docs/RELEASING.md): the certificate opens with its
# password and is the team's Developer ID Application identity, it signs with a secure timestamp, and Apple accepts the
# notarization key. Run by hand (`gh workflow run release-preflight.yml`); in the `release` Environment, so it waits for the
# owner's approval like a release. It loads the keys with the same script the release's signing job does.
name: Release preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-preflight
jobs:
  preflight:
    name: Signing secrets
    runs-on: macos-26
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # THE RULE, as release.yml's: nothing is compiled or run of the product while a signing key or the notarization key is loaded, as a
      # build script could sign or notarize as the team (the second security read of the Find key's branch, 2026-11-15). So everything this
      # job builds is built here, first, with no secret in any step's environment; the steps after the keys only bundle, sign and run it.
      - name: Rust, as pinned in rust-toolchain.toml, with no secret here
        run: rustup toolchain install
      - name: Build the probes, the app's own key path among them, with no secret here
        run: tools/release/dp-keychain-probe.sh --build "$RUNNER_TEMP/dp-probe-built"
      - name: Certificate and notarization key, from the Environment's secrets
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          kc="$RUNNER_TEMP/recto-preflight.keychain-db"
          identity=$(tools/release/keychain.sh "$kc")
          echo "PREFLIGHT_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "PREFLIGHT_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "The certificate opens: $identity"
      - name: It signs, with Apple's secure timestamp, and the signature verifies
        run: |
          cp /usr/bin/true "$RUNNER_TEMP/preflight-probe"
          codesign --force --options runtime --timestamp --sign "$PREFLIGHT_IDENTITY" "$RUNNER_TEMP/preflight-probe"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/preflight-probe"
          codesign -dv "$RUNNER_TEMP/preflight-probe" 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp)='
      - name: Apple accepts the notarization key
        run: |
          xcrun notarytool history --keychain-profile recto-notary --keychain "$PREFLIGHT_KEYCHAIN" --output-format json >/dev/null
          echo "notarytool: the key, its ID and the issuer are accepted"
      # The provisioning profile and the Find key's item in the data-protection keychain (the owner's decision, 2026-11-15), last of all:
      # the profile is checked (Developer ID, macOS, the app's App ID, team and keychain group, 60 days or more to run, made for the
      # certificate that signs), then bundles signed with it are launched and the probe measures what must hold. The profile goes to a
      # file of this job's alone and is never printed; neither is the certificate.
      - name: The provisioning profile, and the Find key in the data-protection keychain
        env:
          MACOS_PROVISION_PROFILE: ${{ secrets.MACOS_PROVISION_PROFILE }}
        run: |
          [ -n "$MACOS_PROVISION_PROFILE" ] || { echo "::error::set the secret MACOS_PROVISION_PROFILE: the app's Developer ID provisioning profile, base64 (docs/RELEASING.md)"; exit 1; }
          umask 077
          printf '%s' "$MACOS_PROVISION_PROFILE" | base64 --decode > "$RUNNER_TEMP/recto.provisionprofile"
          tools/release/dp-keychain-probe.sh "$PREFLIGHT_IDENTITY" "$RUNNER_TEMP/recto.provisionprofile" "$RUNNER_TEMP/dp-probe-built"
      - name: Remove the keychain and anything of a secret
        if: always()
        run: |
          tools/release/keychain.sh --remove "$RUNNER_TEMP/recto-preflight.keychain-db"
          rm -f "$RUNNER_TEMP/preflight-probe" "$RUNNER_TEMP/recto.provisionprofile"
          rm -rf "$RUNNER_TEMP"/dp-keychain-probe.* "$RUNNER_TEMP/dp-probe-built"
