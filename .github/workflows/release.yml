# Pushing a tag vX.Y.Z builds the Mac's release and creates ONE draft release with its assets: RectoPDF-X.Y.Z.zip,
# SHA256SUMS and latest.json. Developer ID signed and notarized, with the secrets in docs/RELEASING.md.
#
# All or nothing: it starts only when the tag matches Cargo.toml and CI passed on the tagged commit, and the draft is
# made only when the build succeeded. When anything fails or is cancelled, the tag (and a draft, if one was made) is
# deleted again, so a fix is followed by a fresh tag of the same version. Publishing the draft stays a click of the
# owner's: that's the moment every installed copy is offered the update (SPEC decision 24). Without the secrets it
# fails rather than ship anything unsigned.
name: Release

on:
  push:
    tags: ["v*.*.*"]

# `actions: read` so the gate can see CI's runs. A list of permissions sets everything else to none.
permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  gate:
    name: Tag and CI
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # for the newest commit that changed anything but documents
          persist-credentials: false
      - name: The tag matches the version in Cargo.toml
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $v"; exit 1; }
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CI skips a commit that changes only documents, so the one to ask about is the newest that doesn't, and a tag on a docs commit is as good as on that.
          code=$(git log -1 --format=%H -- . ':(exclude)docs/**' ':(exclude,glob)**/*.md')
          # The tag is pushed after main, and CI may still be running. Wait for its run on this commit, at most an hour.
          for _ in $(seq 1 120); do
            read -r status conclusion url < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$code" \
                --event push --limit 1 --json status,conclusion,url --jq '.[0] | "\(.status) \(.conclusion) \(.url)"') || true
            if [ "${status:-}" = completed ]; then
              [ "$conclusion" = success ] && { echo "CI passed: $url"; exit 0; }
              echo "::error::CI on $code ended with $conclusion: $url"; exit 1
            fi
            echo "CI on $code: ${status:-not started yet}; waiting"
            sleep 30
          done
          echo "::error::no finished CI run on $code within an hour"; exit 1

  mac:
    name: Mac build
    needs: gate
    runs-on: macos-26
    timeout-minutes: 90
    # An Environment, so the owner can require their own approval before anything here sees a signing secret: pushing a tag alone doesn't get them.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the release notes list the commits since the previous tag
          persist-credentials: false
      - name: Rust, as pinned in rust-toolchain.toml
        run: rustup toolchain install
      # Everything that compiles anything goes first, so no dependency's build script is ever on a machine that holds a signing key.
      - name: Build the release, with no signing key anywhere yet
        env:
          MIN_FREE: '0'
        run: app/release-zip.sh --built-only
      - name: Developer ID certificate and notarization key, from the repository's secrets
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          # A release is Developer ID signed and notarized, never ad hoc.
          for s in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [ -n "${!s}" ] || { echo "::error::a release is Developer ID signed and notarized; set the secret $s (docs/RELEASING.md)"; exit 1; }
          done
          team=$(sed -n 's/^pub const TEAM_ID: &str = "\([A-Z0-9]*\)";$/\1/p' crates/recto-update/src/lib.rs)
          kc="$RUNNER_TEMP/recto-signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          # A keychain of this job's own, in the search list so codesign finds the identity there, removed again at the end.
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          # shellcheck disable=SC2046 # the runner's keychain paths have no spaces
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$kc" >/dev/null
          # Apple's Developer ID intermediate, in case the runner lacks it: the chain must verify.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            && security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc" >/dev/null 2>&1 || true
          identity=$(security find-identity -v -p codesigning "$kc" | sed -n "s/.*\"\(Developer ID Application: .*($team)\)\"\$/\1/p" | head -1)
          [ -n "$identity" ] || { echo "::error::MACOS_CERT_P12 holds no valid Developer ID Application identity of team $team"; exit 1; }
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials recto-notary --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --keychain "$kc" >/dev/null
          rm -f "$RUNNER_TEMP/notary.p8"
          {
            echo "RECTO_SIGN_IDENTITY=$identity"
            echo "RECTO_NOTARY_PROFILE=recto-notary"
            echo "RECTO_NOTARY_KEYCHAIN=$kc"
          } >> "$GITHUB_ENV"
          echo "Signing as: $identity"
      - name: Sign, notarize, run and check what was built
        run: app/release-zip.sh --signed --already-built
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac
          path: |
            app/build/release/RectoPDF-*.zip
            app/build/release/SHA256SUMS
            app/build/release/latest.json
            app/build/release/NOTES.md
          if-no-files-found: error
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/recto-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"

  draft:
    name: Draft release
    needs: mac
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mac
          path: assets
      - name: Create the draft, not published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "RectoPDF $v" \
            --notes-file assets/NOTES.md assets/RectoPDF-"$v".zip assets/SHA256SUMS assets/latest.json

  withdraw:
    name: Withdraw the tag
    needs: [gate, mac, draft]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete the draft, if one was made, and the tag, and never a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Someone can run this again after the release went out. That fails, as the release is there, and it's not for this to take back what's been published.
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = false ]; then
            echo "::error::$GITHUB_REF_NAME is published already, so this run failed and left it alone."
            exit 1
          fi
          if [ "$draft" = true ]; then
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME" || true
          fi
          echo "::error::The release of $GITHUB_REF_NAME was withdrawn: fix the failure, then tag the version again."
          exit 1
