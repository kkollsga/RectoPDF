# A clean checkout on someone else's Mac: what passes here doesn't depend on this machine's folders.
# Runs on main and on build/* branches before they merge (owner, 2026-11-11), never on outside pull requests, skips docs, and a newer
# push to the same branch cancels an older run.
#
# One `check` job, not three parts (2026-11-12). R0.6 split the full check into core, window and lifecycle jobs, five macOS jobs a run with the two sandbox
# jobs. On 2026-11-12 GitHub couldn't supply macos-26 runners for that: main's run 43248252599 at da3e556 twice had core, window and the macos-26 sandbox job
# cancelled unacquired, "The job was not acquired by Runner of type hosted even after multiple attempts", while macos-15 jobs got a runner at once. So the
# check is one job again, three macOS jobs a run; CHECK_PART stays in tools/check.sh for local use and `--like-ci`. Kept from the split: the cache layout,
# the tools' tests only when what they test changed, and registrations running after a failed app stage.
#
# The cache, and its limit. GitHub keeps 10 GB of cache for the repository and evicts the least recently used beyond it. On 2026-11-12 it held 10.81 GB in 8
# caches, the Rust ones about 3.1 GB each, and a cache saved on a branch was evicted within 20 minutes, so the next run fell back to an old one and saved
# again. So: one Rust cache per Cargo.lock, `check-<hash>`, saved only on main and only on a miss. Every job restores, a branch from main's, falling back by
# prefix to the latest `check-` cache (the split's `check-core-` and `check-app-` ones included) when its Cargo.lock differs, so it starts warm. With the
# sandbox jobs' (about 0.15 and 0.22 GB) and PDFium's (3 MB) that is about 3.5 GB a lock. A cache per job or per branch, or a save on branches, puts it past
# 10 GB again: count it against this first.
#
# What is left out of the saved cache (2026-11-14; the cache was 5.8 GB and its restore took 118 to 214 s a run): target/pdfium (its own cache above),
# target/nextest (a run's junit, overwritten by the next), target/recto-evidence (a run's evidence; on CI it is under RUNNER_TEMP anyway) and
# ~/.cargo/registry/src (the unpacked crates: cargo unpacks them again from registry/cache, in seconds). Changing `path:` changes the cache's version,
# so no older `check-` cache matches by prefix: the first run after this is a cold build, once. Not pruned: stale test executables from the prefix
# fallback. Cargo keeps no record of which files a run used, and atime isn't reliable here, so no rule could be shown never to delete what the next run needs.
#
# How long. A whole run took 12 to 15 minutes in one job (2026-11-12), and the tools' tests add about 3 when they run. A failed stage's tests run again
# (tools/check-rerun.sh, R0.7c): at most 8 tests, no round after 240 s of a stage's rounds, and no round at all after 360 s of the whole run's
# (CHECK_RERUN_TOTAL_SECONDS), so a badly broken branch adds at most 360 s and one round (nextest ends a test at 300 s): 11 minutes. 15 + 3 + 11 is 29;
# the limit is 45, for a slow runner.
name: CI
on:
  push:
    branches: [main, 'build/**']
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # What a full check runs, as tools/check.sh says with CI set: the compile gate, the workspace tests, the tools' own tests when what they test changed since
  # CI's base (`ci_base` in tools/check-scope.sh, which needs the history: the whole of it is checked out), the app, built, and both tiers of its tests, then
  # what is left registered. The ratchet (tools/ratchet.sh) runs first.
  check:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # A runner has less memory free than heavy.sh asks of the owner's Mac, and it runs one job alone.
      MIN_FREE: '0'
      # Every failure in one round trip, not only the first.
      NEXTEST_PROFILE: ci
      CARGO_TERM_COLOR: always
      # No incremental data on CI (2026-11-14): every run starts from a restored cache of another commit, which incremental compilation can't use
      # (it keys on the crate's own previous session in this folder, and it is written at every build and then saved and restored as bytes), so it
      # only costs compile time and cache size here. Dependencies are never incremental; only the workspace crates are.
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 0 is all of it: the tools' tests compare with CI's base.
          fetch-depth: 0
      - name: Rust, as pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@dd2e657c648186b8f995f901aaf7d95fbd87ee34 # nextest
        id: nextest
        continue-on-error: true
      # Its download host returned 504 for every try on 2026-11-08, failing every job before anything was built. Built from source then.
      - name: nextest from source, when the download failed
        if: steps.nextest.outcome == 'failure'
        run: cargo install cargo-nextest --locked
      # PDFium alone, in a cache every job shares: on 2026-11-08 GitHub's release downloads answered 504 for over an hour, and only a job
      # whose own cache already held it could run. The checksum in tools/pdfium.sh still decides what's used.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/pdfium
          key: pdfium-${{ hashFiles('tools/pdfium.sh') }}
      # One cache, saved only on main (the cache at the top of this file). A branch restores main's, the same lock's or by prefix the latest.
      - name: Rust's cache, restored
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !~/.cargo/registry/src
            !target/pdfium
            !target/nextest
            !target/recto-evidence
          key: check-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            check-
      # What the cache holds, after the restore and again before the save: sizes only, 30 lines a listing, a few seconds (tools/ci-cache-report.sh;
      # lines start with "cache-report"). Read the two against each other and against the restore's "Cache Size" line.
      - name: What the restored cache holds
        run: tools/ci-cache-report.sh after-restore
      - name: Full check
        run: tools/check.sh --full
        env:
          # A failing test's quiet-run logs are copied here before its state folder goes (crates/recto-cli/tests/common/mod.rs).
          RECTO_TEST_LOGS: ${{ runner.temp }}/recto-test-logs
          # And its evidence, one folder a failed test and a folder a rerun round (crates/recto-cli/tests/common/evidence.rs, tools/check-rerun.sh): every
          # launch's messages, `qa state`, threads, a sample, the slow seams, the machine, Launch Services and the command that runs it again on a Mac. Uploaded
          # with the logs below. A failed stage's tests run again 4 times here (CHECK_RERUN, set by tools/check.sh on CI) and the log has "failed N of M".
          RECTO_EVIDENCE: ${{ runner.temp }}/recto-test-logs/evidence
      - name: What the cache holds, before it is saved
        if: success() && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: tools/ci-cache-report.sh before-save
      # Before the logs and artifacts, so a failure there can't lose it.
      - name: Rust's cache, saved on main
        if: success() && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !~/.cargo/registry/src
            !target/pdfium
            !target/nextest
            !target/recto-evidence
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      # What CI saw, when it fails: run 43054237265 said only that the app had gone, so a crash, a time limit and a test looking too late
      # couldn't be told apart (2026-11-11). The quiet runs' logs above, and the system's crash reports for the app and its helpers.
      - name: Crash reports, when the check failed
        if: failure()
        run: |
          into="$RUNNER_TEMP/recto-test-logs/crash-reports"
          mkdir -p "$into"
          for folder in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            find "$folder" -maxdepth 1 -type f \( -name 'RectoPDF*' -o -name 'recto*' \) -mmin -90 -exec cp {} "$into/" \; 2>/dev/null || true
          done
          ls -la "$RUNNER_TEMP/recto-test-logs" "$into"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: check-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recto-test-logs
          retention-days: 7
          if-no-files-found: ignore
      # Per-test durations (tools/check-times.sh), for a process review: `tools/check.sh --slow` reads the same files on a Mac.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-times-${{ github.run_attempt }}
          path: .git/recto-test-times
          retention-days: 14
          if-no-files-found: ignore
  # The renderer's sandbox on the oldest macOS a release supports (LSMinimumSystemVersion 15.0) and on the newest runner, where the home folder is
  # under /Users, unlike the Mac this was built on. The walls lean on how the kernel describes ports and on the App Sandbox's own variables, so a
  # change in either between versions fails here, not on a user's Mac as a renderer that won't start.
  sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NEXTEST_PROFILE: ci
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust, as pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@dd2e657c648186b8f995f901aaf7d95fbd87ee34 # nextest
        id: nextest
        continue-on-error: true
      # Its download host returned 504 for every try on 2026-11-08, failing every job before anything was built. Built from source then.
      - name: nextest from source, when the download failed
        if: steps.nextest.outcome == 'failure'
        run: cargo install cargo-nextest --locked
      # PDFium alone, in a cache every job shares: on 2026-11-08 GitHub's release downloads answered 504 for over an hour, and only a job
      # whose own cache already held it could run. The checksum in tools/pdfium.sh still decides what's used.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/pdfium
          key: pdfium-${{ hashFiles('tools/pdfium.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sandbox-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: sandbox-${{ matrix.os }}-
      - name: Where this runs
        run: sw_vers && echo "HOME=$HOME"
      - name: PDFium
        run: tools/pdfium.sh
      # Printed even when it passes: how this macOS describes each right the drop decides on, and what a compromised worker could fetch back. It differs between versions.
      - name: How the kernel describes the worker's rights here
        run: cargo nextest run --locked -p recto-platform --test walls --no-capture -E 'test(no_right_to_launchd_can_be_fetched_back_after_the_drop)'
      - name: The walls and the sandboxed worker, signed ad hoc into the real layout
        run: |
          cargo build --locked -p recto-render-service
          cargo nextest run --locked --no-fail-fast -p recto-platform --test walls --lib
          cargo nextest run --locked --no-fail-fast -p recto-render-service --test sandbox --test surfaces
      - name: The renderer's whole suite against that sandboxed worker
        run: |
          contents="$RUNNER_TEMP/Host.app/Contents"
          app/render-helper.sh --layout "$contents" target/debug/recto-render-service target/pdfium/libpdfium.dylib
          app/render-helper.sh --check "$contents/Helpers/RectoRender.app"
          RECTO_TEST_WORKER="$contents/Helpers/RectoRender.app/Contents/MacOS/recto-render-service" cargo nextest run --locked --no-fail-fast -p recto-render-service
      # Printed even when it passes: the sandboxed worker's footprint after each page, which retirement reads, with and without retiring. On macOS 15 it once never
      # crossed a fixed line though the peak did.
      - name: What retirement sees of the sandboxed worker here
        if: ${{ !cancelled() }}
        run: |
          contents="$RUNNER_TEMP/Host.app/Contents"
          RECTO_TEST_WORKER="$contents/Helpers/RectoRender.app/Contents/MacOS/recto-render-service" cargo nextest run --locked -p recto-render-service --test memory --no-capture -E 'test(retiring_holds_down_a_growing_worker)'
