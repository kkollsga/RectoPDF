# A clean checkout on someone else's Mac: what passes here doesn't depend on this machine's folders.
# Runs on main and on build/* branches before they merge (owner, 2026-11-11), never on outside pull requests, skips docs, and a newer
# push to the same branch cancels an older run.
name: CI
on:
  push:
    branches: [main, 'build/**']
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # What a full check runs, in three jobs at once instead of one after the other (a run took 12 to 15 minutes in one job, 2026-11-12). The one definition of what runs
  # is still tools/check.sh: CHECK_PART names the part (tools/check-scope.sh has the tiers), and together the parts are everything `tools/check.sh --full` runs
  # with CI set. core: the compile gate, the workspace tests and the tools' own tests (tools/check-test.sh, tools/ratchet-test.sh). window: the app, built, and
  # the tests of drawing, AppKit, the bridge and restoring state. lifecycle: the app again, and the tests of updates, Launch Services, long sessions, a thousand
  # tabs and what is left registered. Each builds the app itself: one build job to hand it over would make the other two wait for it (87 to 140 s) and then
  # download it, to save the 20 s of Rust each app part builds. The ratchet (tools/ratchet.sh) runs first in every part. The tools' own tests run in core only
  # when what they test changed since CI's base (`ci_base` in tools/check-scope.sh), which needs the history: core checks out all of it, the app parts one commit.
  parts:
    name: check (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [core, window, lifecycle]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # A runner has less memory free than heavy.sh asks of the owner's Mac, and it runs one job alone.
      MIN_FREE: '0'
      # Every failure in one round trip, not only the first.
      NEXTEST_PROFILE: ci
      CARGO_TERM_COLOR: always
      CHECK_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 0 is all of it. Written so, as `0` alone reads as false in an expression and would give 1.
          fetch-depth: ${{ matrix.part != 'core' && 1 || 0 }}
      - name: Rust, as pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@dd2e657c648186b8f995f901aaf7d95fbd87ee34 # nextest
        id: nextest
        continue-on-error: true
      # Its download host returned 504 for every try on 2026-11-08, failing every job before anything was built. Built from source then.
      - name: nextest from source, when the download failed
        if: steps.nextest.outcome == 'failure'
        run: cargo install cargo-nextest --locked
      # PDFium alone, in a cache every job shares: on 2026-11-08 GitHub's release downloads answered 504 for over an hour, and only a job
      # whose own cache already held it could run. The checksum in tools/pdfium.sh still decides what's used.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/pdfium
          key: pdfium-${{ hashFiles('tools/pdfium.sh') }}
      # One cache a part: three jobs saving under one key would keep only the first's. The plain `check-` prefix is the old single job's, which a part falls back to.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ matrix.part }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            check-${{ matrix.part }}-
            check-
      - name: Full check, this part
        run: tools/check.sh --full
        env:
          # A failing test's quiet-run logs are copied here before its state folder goes (crates/recto-cli/tests/common/mod.rs).
          RECTO_TEST_LOGS: ${{ runner.temp }}/recto-test-logs
      # What CI saw, when it fails: run 43054237265 said only that the app had gone, so a crash, a time limit and a test looking too late
      # couldn't be told apart (2026-11-11). The quiet runs' logs above, and the system's crash reports for the app and its helpers.
      - name: Crash reports, when the check failed
        if: failure()
        run: |
          into="$RUNNER_TEMP/recto-test-logs/crash-reports"
          mkdir -p "$into"
          for folder in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            find "$folder" -maxdepth 1 -type f \( -name 'RectoPDF*' -o -name 'recto*' \) -mmin -90 -exec cp {} "$into/" \; 2>/dev/null || true
          done
          ls -la "$RUNNER_TEMP/recto-test-logs" "$into"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: check-logs-${{ matrix.part }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recto-test-logs
          retention-days: 7
          if-no-files-found: ignore
      # Per-test durations of this part (tools/check-times.sh), for a process review: `tools/check.sh --slow` reads the same files on a Mac.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-times-${{ matrix.part }}-${{ github.run_attempt }}
          path: .git/recto-test-times
          retention-days: 14
          if-no-files-found: ignore
  # The one name that stands for the whole check, as the single job was called: the three parts pass together or this fails. Nothing else to run, so a cheap runner.
  check:
    needs: parts
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `needs.parts.result` is success only when every part of the matrix succeeded; failure, cancelled and skipped all fail this job, so a required
      # check named `check` can never read as passing because a part didn't run.
      - name: All three parts passed
        env:
          RESULT: ${{ needs.parts.result }}
        run: |
          echo "check (core, window, lifecycle): $RESULT"
          [ "$RESULT" = success ] || { echo "A part did not succeed ($RESULT), so check fails." >&2; exit 1; }
  # The renderer's sandbox on the oldest macOS a release supports (LSMinimumSystemVersion 15.0) and on the newest runner, where the home folder is
  # under /Users, unlike the Mac this was built on. The walls lean on how the kernel describes ports and on the App Sandbox's own variables, so a
  # change in either between versions fails here, not on a user's Mac as a renderer that won't start.
  sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NEXTEST_PROFILE: ci
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust, as pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@dd2e657c648186b8f995f901aaf7d95fbd87ee34 # nextest
        id: nextest
        continue-on-error: true
      # Its download host returned 504 for every try on 2026-11-08, failing every job before anything was built. Built from source then.
      - name: nextest from source, when the download failed
        if: steps.nextest.outcome == 'failure'
        run: cargo install cargo-nextest --locked
      # PDFium alone, in a cache every job shares: on 2026-11-08 GitHub's release downloads answered 504 for over an hour, and only a job
      # whose own cache already held it could run. The checksum in tools/pdfium.sh still decides what's used.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/pdfium
          key: pdfium-${{ hashFiles('tools/pdfium.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sandbox-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: sandbox-${{ matrix.os }}-
      - name: Where this runs
        run: sw_vers && echo "HOME=$HOME"
      - name: PDFium
        run: tools/pdfium.sh
      # Printed even when it passes: how this macOS describes each right the drop decides on, and what a compromised worker could fetch back. It differs between versions.
      - name: How the kernel describes the worker's rights here
        run: cargo nextest run --locked -p recto-platform --test walls --no-capture -E 'test(no_right_to_launchd_can_be_fetched_back_after_the_drop)'
      - name: The walls and the sandboxed worker, signed ad hoc into the real layout
        run: |
          cargo build --locked -p recto-render-service
          cargo nextest run --locked --no-fail-fast -p recto-platform --test walls --lib
          cargo nextest run --locked --no-fail-fast -p recto-render-service --test sandbox --test surfaces
      - name: The renderer's whole suite against that sandboxed worker
        run: |
          contents="$RUNNER_TEMP/Host.app/Contents"
          app/render-helper.sh --layout "$contents" target/debug/recto-render-service target/pdfium/libpdfium.dylib
          app/render-helper.sh --check "$contents/Helpers/RectoRender.app"
          RECTO_TEST_WORKER="$contents/Helpers/RectoRender.app/Contents/MacOS/recto-render-service" cargo nextest run --locked --no-fail-fast -p recto-render-service
      # Printed even when it passes: the sandboxed worker's footprint after each page, which retirement reads, with and without retiring. On macOS 15 it once never
      # crossed a fixed line though the peak did.
      - name: What retirement sees of the sandboxed worker here
        if: ${{ !cancelled() }}
        run: |
          contents="$RUNNER_TEMP/Host.app/Contents"
          RECTO_TEST_WORKER="$contents/Helpers/RectoRender.app/Contents/MacOS/recto-render-service" cargo nextest run --locked -p recto-render-service --test memory --no-capture -E 'test(retiring_holds_down_a_growing_worker)'
