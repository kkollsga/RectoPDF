# A hung test ends the run rather than sitting there: socket tests block on purpose, and a bug in one would wait for ever.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# On CI, every test runs and every failure shows at once, as a round trip there costs minutes. It takes what isn't set here from `default`. Picked by NEXTEST_PROFILE in .github/workflows/ci.yml.
[profile.ci]
fail-fast = false

# The binaries holding the slowest tests (10 to 50 s each, against a median under a tenth of a second) start first, so the run doesn't wait on one
# that happened to start last. On 2026-11-11 the socket test that takes 24 s started with 26 s of a 50 s run left. Only the order changes: each test
# is still a process of its own, with the same limits. docs/reports/build-performance-2026-11-11.md has the numbers.
[[profile.default.overrides]]
filter = 'binary(installer) | binary(smoke) | binary(socket) | binary(engine) | binary(long_session)'
priority = 50

# JUnit for every run, which tools/check.sh reads after each stage to keep the per-test durations (tools/check-times.sh, `check.sh --slow`). Written to
# target/nextest/<profile>/junit.xml, overwritten by the next run, so the check collects it after every stage. Failing output stays out: it is in the run's log.
[profile.default.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = false

# On CI the restore tests' output shows when they pass too, at the end of the run: a comparison let through by the CI-only exception for the contents'
# pane (crates/recto-cli/tests/restore/ci_known.rs, due 2026-11-18) says so there, with what the apps said, so a green job still leaves the evidence.
# Find it with: grep 'ci-known exception used'.
[[profile.ci.overrides]]
filter = 'binary(=restore)'
success-output = "final"
